schema_version = 2
id = "kasumi-adaptive"
name = "Kasumi Adaptive"
version = "0.5.7"
author = "Kasumi"
description = "Fixed artwork at 0.75 of v0.5.2; font 15, right portrait 90% and raised 10 DIP. Native item edges drive frets."
base = "canvas"

[supports]
layouts = ["horizontal"]
themes = ["light", "dark"]

[candidate_window]
# Include the portrait's reserved width in the card so screen placement keeps it visible.
min_width_dip = 693.0292817679558
max_width_dip = 1032
# Reserve the longest ribbon at composition start so growth stays on the right.
reserve_max_width = true
fit_content = true
corner_radius_dip = 0
border_width_dip = 0
item_corner_radius_dip = 0
shadow = "none"
backdrop = "none"
font_family = "SimHei"
page_arrows = false
line_gap_dip = 0

[candidate_window.item_separators]
color = "#ffad00"
top_dip = 6.75
bottom_dip = 38.25
line_width_dip = 0.4875
line_gap_dip = 1.05

[candidate_window.band_artwork]
background = "assets/native-band-background.png"
foreground = "assets/native-band-foreground.png"
width_dip = 1032
height_dip = 344
offset_y_dip = -219.75
foreground_right_clip_dip = 137.6950276243094

# 15 DIP candidate text is supplied by the installing wrapper.
[candidate_window.horizontal]
single_line = true
item_min_width = 54
item_gap = 0
number_inset = 5.625
number_gap = 4.5
number_scale = 0.75
justify_rows = false
item_extra_height = 0

[candidate_window.content_insets_dip]
# Raise the text by 1.5 DIP without moving the artwork or changing card height.
top = 11.25
bottom = 63
left = 111.65745856353591
right = 203.37182320441988

# The portrait footprint is reserved inside content padding, not outside the card.
# The whole artwork (portrait, guitar and stars) is drawn by the helper.
[candidate_window.outer_insets_dip]
top = 146.25
bottom = 0
left = 0
right = 0

# The v0.5.4 foreground decoration owns only the left guitar.
# Native candidate layout, text and synchronized separators remain unchanged.

[candidate.light]
surface = "transparent"
border = "transparent"
text = "#78300c"
candidate_text = "#78300c"
number = "#78300c"
accent = "#f59a16"
selected = "transparent"
hover = "transparent"
show_selected_bar = false
selected_text = "#78300c"
selected_number = "#78300c"
preedit_text = "transparent"
preedit_background = "transparent"
preedit_divider = "transparent"

[candidate.dark]
surface = "transparent"
border = "transparent"
text = "#78300c"
candidate_text = "#78300c"
number = "#78300c"
accent = "#f59a16"
selected = "transparent"
hover = "transparent"
show_selected_bar = false
selected_text = "#78300c"
selected_number = "#78300c"
preedit_text = "transparent"
preedit_background = "transparent"
preedit_divider = "transparent"

[license]
code = "MIT"
assets = "User-provided artwork"


# Independent transparent APNG; zero measurement and native click-through front layer.
[[candidate_window.decorations]]
image = "assets/guitar-swing.png"
anchor = "top-left"
offset_x_dip = -3.8011049723756907
offset_y_dip = -57.727900552486176
width_dip = 170.5745856353591
height_dip = 139.21546961325967
z_index = 2


# Native, event-driven foreground particles; no layout participation.
[candidate_window.typed_stars]
enabled = true
yellow_image = "assets/star_y.png"
pink_image = "assets/star_m.png"
blue_image = "assets/star_b.png"
origin_x_dip = 66.51933701657458
origin_y_dip = 22.570441988950278
min_x_dip = 8
max_x_dip = 107
min_y_dip = -100
max_y_dip = 132

# Image width stays proportional; 19-23 DIP is larger than the first 14-18 DIP draft.
width_min_dip = 19
width_max_dip = 23

# Rise is measured from the guitar origin. End Y is relative to the card top.
# About one visible candidate-ribbon thickness below its bottom, including fade-out.
rise_min_dip = 24
rise_max_dip = 38
end_x_min_dip = 18
end_x_max_dip = 94
end_y_min_dip = 96
end_y_max_dip = 108
pair_separation_dip = 22

duration_min_ms = 1200
duration_max_ms = 1450
fade_in_min_ms = 90
fade_in_max_ms = 130
fade_out_min_ms = 260
fade_out_max_ms = 360

# Rotation at birth and total rotation during the flight.
rotation_min_deg = -24
rotation_max_deg = 24
spin_min_deg = -70
spin_max_deg = 70
[candidate_window.livesd]
click_image = "assets/livesd/click-reaction.gif"
click_duration_ms = 1600
enabled = true
idle_image = "assets/livesd/sd001001/anim001.png"
idle2_image = "assets/livesd/sd001001/anim002.png"
happy_image = "assets/livesd/sd001001/anim003.png"
miss_image = "assets/livesd/sd001001/anim004.png"
stage_width_dip = 520
stage_height_dip = 246
width_dip = 161.28
height_dip = 185.472
foot_y_dip = 233

# Foreground pendant beneath the text row; no hit testing.
[[candidate_window.decorations]]
image = "assets/poppinparty-heads.png"
anchor = "top-left"
offset_x_dip = 147.6
offset_y_dip = 32.5
width_dip = 179.2
height_dip = 35.84
z_index = 3