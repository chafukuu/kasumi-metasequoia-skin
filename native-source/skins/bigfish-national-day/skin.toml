# 大肥鱼·国庆：红色女仆裙敬礼的大肥鱼站在卡片右上方，金色星星背景，配色取自红裙、金星和深蓝发色。
# 所有图片路径都相对于本皮肤目录。
schema_version = 1
id = "bigfish-national-day"
name = "大肥鱼·国庆"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "国庆版大肥鱼：卡片右上方敬礼的红裙角色、金色星星背景，中国红高亮搭配金色序号。"
base = "fluent"

[supports]
layouts = ["horizontal", "vertical"]
