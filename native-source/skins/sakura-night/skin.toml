# 水杉输入法 schema_version 2 实机演示皮肤「夜樱」。
# 用到 v2 的全部能力：canvas 基底、九宫格面板、面板后/前两层挂件、APNG 与 GIF 动图、内容内边距、外留白、行距。
# 所有图片由 tools/gen_sakura_night.py 程序生成，随本目录以 MIT 授权；都是 2 倍图（像素尺寸是下面 *_dip 的两倍）。

schema_version = 2
id = "sakura-night"
name = "夜樱 · v2 演示"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "v2 全贴图演示：紫夜玻璃九宫格面板、面板后的月亮、右侧飘落的花瓣（APNG）、左下闪烁的星星（GIF）。"
base = "canvas"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 220
item_corner_radius_dip = 6
line_gap_dip = 6                   # 预编辑行与候选之间

# 96×96 的 2 倍面板图：切片 24 像素，边框画 12 DIP。四角的小樱花在切片之内，面板怎么拉伸都不变形。
[candidate_window.border_image]
source = "assets/panel.png"
slice_dip = [24]
width_dip = [12]
fill = true

# 内容离面板外缘的距离；左右多留一点，避开四角的小樱花。
[candidate_window.content_insets_dip]
top = 12
right = 16
bottom = 12
left = 18

# 挂件伸出面板的部分需要的窗口留白。
[candidate_window.outer_insets_dip]
top = 30
right = 36
bottom = 22
left = 12

# 月亮：z_index < 1，画在面板之后，只露出右上角伸出去的那一截。
[[candidate_window.decorations]]
image = "assets/moon.png"
anchor = "top-right"
offset_x_dip = 30
offset_y_dip = -30
width_dip = 72
height_dip = 72
z_index = -1

# 飘落的花瓣：24 帧 × 70 ms 循环的 APNG，沿右侧边框落下。
[[candidate_window.decorations]]
image = "assets/petals.apng"
anchor = "bottom-right"
offset_x_dip = 36
offset_y_dip = 22
width_dip = 48
height_dip = 80
z_index = 3

# 闪烁的星星：8 帧 × 150 ms 循环的 GIF。
[[candidate_window.decorations]]
image = "assets/stars.gif"
anchor = "bottom-left"
offset_x_dip = -12
offset_y_dip = 16
width_dip = 40
height_dip = 20
z_index = 1

# 面板是深色的，深浅两套主题都用浅色文字。
[candidate.dark]
accent = "#ff8fb8"
selected = "rgba(255, 143, 184, 0.22)"
hover = "rgba(255, 143, 184, 0.12)"
text = "#f5ecff"
number = "rgba(245, 236, 255, 0.58)"
translation = "#c9b8ff"
preedit_text = "#ffc4dc"
selected_text = "#ffffff"
selected_bar = "#ffd27a"

[candidate.light]
accent = "#ff8fb8"
selected = "rgba(255, 143, 184, 0.24)"
hover = "rgba(255, 143, 184, 0.14)"
text = "#f5ecff"
number = "rgba(245, 236, 255, 0.60)"
translation = "#c9b8ff"
preedit_text = "#ffc4dc"
selected_text = "#ffffff"
selected_bar = "#ffd27a"

# 悬浮工具栏跟候选窗同一套紫夜配色：底色取面板的紫，边框取面板的粉边，拖动条用主题粉，图标同候选文字。
# 面板在深浅两套主题下都是深色，工具栏也一样。
[toolbar]
corner_radius_dip = 10             # 与面板圆角一致（面板图 20 像素圆角，2 倍图）

[toolbar.dark]
background = "#211838"
border = "rgba(255, 170, 205, 0.55)"
handle = "#ff8fb8"
divider = "rgba(255, 143, 184, 0.28)"
icon = "#f5ecff"
hover = "rgba(255, 143, 184, 0.18)"

[toolbar.light]
background = "#211838"
border = "rgba(255, 170, 205, 0.55)"
handle = "#ff8fb8"
divider = "rgba(255, 143, 184, 0.28)"
icon = "#f5ecff"
hover = "rgba(255, 143, 184, 0.18)"

[license]
code = "MIT"
assets = "MIT"
source = "Procedurally generated by the Metasequoia IME contributors."
