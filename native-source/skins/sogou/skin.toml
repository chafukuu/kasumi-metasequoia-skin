schema_version = 1

id = "sogou"
name = "搜狗经典"
version = "1.0.0"
description = "搜狗经典配色：白底、蓝色候选、橙红高亮、红色光标"
base = "fluent"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 0

[candidate.dark]
accent = "#FF6A00"
selected = "rgba(232,64,10,.28)"
hover = "rgba(232,64,10,.20)"
surface = "#1A1E24"
border = "rgba(232,64,10,.35)"
text = "#7FA5FF"
number = "#7FA5FF"
translation = "#529E72"
translation_pos = "#529CCA80"
translation_separator = "#529E7273"
selected_translation = "#67AA83"
selected_translation_pos = "#529CCA80"
selected_translation_separator = "#67AA8373"
show_selected_bar = false

[candidate.light]
accent = "#E8400A"
selected = "#FDDCCB"
hover = "rgba(232,64,10,.10)"
surface = "#FFFFFF"
border = "#C5CEDA"
text = "#1235CC"
number = "#1235CC"
translation = "#448361"
translation_pos = "#0B6E9980"
translation_separator = "#44836173"
selected_translation = "#3A6F52"
selected_translation_pos = "#0B6E9980"
selected_translation_separator = "#3A6F5273"
show_selected_bar = false

# 工具栏跟候选窗同一套底色、边框，橙红拖动条、蓝色图标；不写会沿用 fluent 的黑底紫条。
[toolbar.dark]
background = "#1A1E24"
border = "rgba(232,64,10,.35)"
handle = "#FF6A00"
divider = "rgba(232,64,10,.24)"
icon = "#7FA5FF"
hover = "rgba(232,64,10,.20)"

[toolbar.light]
background = "#FFFFFF"
border = "#C5CEDA"
handle = "#E8400A"
divider = "#C5CEDA"
icon = "#1235CC"
hover = "rgba(232,64,10,.10)"
